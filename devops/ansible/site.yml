---
- name: Validate the K3s inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require one server and at least one agent
      ansible.builtin.assert:
        that:
          - groups['k3s_server'] | default([]) | length == 1
          - groups['k3s_agents'] | default([]) | length >= 1
        fail_msg: >-
          The inventory must contain exactly one k3s_server and at least one
          k3s_agent.

- name: Prepare all K3s nodes
  hosts: k3s
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for SSH connectivity
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather host facts
      ansible.builtin.setup:

  roles:
    - role: common

- name: Install the K3s server
  hosts: k3s_server
  become: true
  gather_facts: false
  serial: 1
  roles:
    - role: k3s_server

- name: Join the K3s agents
  hosts: k3s_agents
  become: true
  gather_facts: false
  roles:
    - role: k3s_agent

- name: Verify the cluster
  hosts: k3s_server
  become: true
  gather_facts: false
  tasks:
    - name: List K3s nodes
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get nodes -o wide
      register: k3s_nodes_result
      changed_when: false

    - name: Display K3s nodes
      ansible.builtin.debug:
        var: k3s_nodes_result.stdout_lines
