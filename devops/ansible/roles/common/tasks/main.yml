---
- name: Require a private IP for the node
  ansible.builtin.assert:
    that:
      - k3s_private_ip is defined
      - k3s_private_ip | length > 0
    fail_msg: >-
      Set k3s_private_ip for {{ inventory_hostname }} in inventory/hosts.ini.

- name: Install common packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set the node hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Disable active swap
  ansible.builtin.command:
    cmd: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: true

- name: Disable swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#]\S+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'

- name: Configure required kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Load the overlay kernel module
  ansible.builtin.command:
    cmd: modprobe overlay
  changed_when: false

- name: Load the bridge netfilter kernel module
  ansible.builtin.command:
    cmd: modprobe br_netfilter
  changed_when: false

- name: Configure Kubernetes networking sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-k3s.conf
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
  notify: Reload sysctl settings
