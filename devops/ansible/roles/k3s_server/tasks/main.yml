---
- name: Require the server private IP
  ansible.builtin.assert:
    that:
      - k3s_private_ip is defined
      - k3s_private_ip | length > 0
    fail_msg: >-
      Set k3s_private_ip for {{ inventory_hostname }} in inventory/hosts.ini.

- name: Download the K3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/src/k3s-install.sh
    mode: "0755"

- name: Install the K3s server
  ansible.builtin.command:
    cmd: /usr/local/src/k3s-install.sh
    creates: /etc/systemd/system/k3s.service
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_EXEC: >-
      server
      --node-name {{ inventory_hostname }}
      --node-ip {{ k3s_private_ip }}
      --advertise-address {{ k3s_private_ip }}
      --write-kubeconfig-mode 0640

- name: Enable and start the K3s server
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Wait for the K3s API
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    delay: 2
    timeout: 180

- name: Read the K3s node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_file
  no_log: true

- name: Keep the K3s token in memory for the agent play
  ansible.builtin.set_fact:
    k3s_node_token: "{{ k3s_token_file.content | b64decode | trim }}"
  no_log: true

- name: Verify the K3s server node
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl get node {{ inventory_hostname }}
  changed_when: false
